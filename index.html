<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود ربات جنگ جهانی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #232526 0%, #414345 100%); padding: 20px;
        }
        .card {
            background: #1e1e2f; padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); text-align: center;
            max-width: 460px; width: 100%; border: 1px solid #333;
        }
        .icon { font-size: 64px; margin-bottom: 15px; }
        h1 { font-size: 22px; color: #ff4d4d; margin-bottom: 10px; }
        p { color: #bbb; font-size: 14px; margin-bottom: 25px; line-height: 1.8; }
        .features {
            text-align: right; background: #2a2a3d; border-radius: 12px;
            padding: 15px 20px; margin-bottom: 25px; font-size: 13px;
            color: #ddd; line-height: 2;
        }
        .features b { color: #ff4d4d; }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff4d4d, #b30000);
            color: #fff; text-decoration: none; padding: 14px 40px;
            border-radius: 12px; font-size: 16px; font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(255, 77, 77, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 77, 77, 0.6);
        }
        .download-btn:active { transform: translateY(0); }
        .file-name { margin-top: 18px; font-size: 12px; color: #666; direction: ltr; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚔️</div>
        <h1>ربات بازی جنگ جهانی</h1>
        <p>سورس کامل ربات استراتژیک جنگ جهانی برای روبیکا</p>

        <div class="features">
            🌍 <b>انتخاب کشور</b> (ایران، روسیه، آمریکا، چین)<br>
            💰 سیستم <b>طلا و نفت</b><br>
            🚜 ساخت <b>تانک و سرباز</b><br>
            ⚔️ حمله به کشورهای تصادفی<br>
            📊 سیستم <b>قدرت نظامی</b> و غنیمت
        </div>

        <!-- لینک دانلود فایل -->
        <a href="bot.py" download="bot.py" class="download-btn">
            ⬇️ دانلود سورس
        </a>

        <div class="file-name">bot.py</div>
    </div>
</body>
</html>
